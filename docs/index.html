<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pistón libre</title>
  <meta name="description" content="Resumen diario de noticias de autos.">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body id="top">
  <header class="site-header">
    <div class="site-header-inner">
      <a class="site-header-logo" href="index.html">
        <img class="logo" src="logo.png" alt="Pistón libre" width="48" height="48">
      </a>
      <a class="site-header-title" href="index.html">
        <img class="lettering" src="lettering.png" alt="Pistón Libre" width="138" height="40">
      </a>
      <div class="site-header-tools">
        <form class="header-search" role="search" action="index.html" method="get">
          <label class="visually-hidden" for="busqueda">Buscar noticias</label>
          <input class="header-search-input" id="busqueda" type="search" name="q" placeholder="Buscar noticias" autocomplete="off">
          <button class="header-search-btn" type="submit" aria-label="Buscar">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="10.5" cy="10.5" r="5.5" fill="none" stroke="currentColor" stroke-width="2"/>
              <path d="M15.2 15.2 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
        </form>
      </div>
    </div>
  </header>
  <div class="hero">
    <p class="eyebrow">Resumen diario de noticias</p>
    <nav class="site-nav" aria-label="Secciones">
      <a href="index.html" aria-current="page">Hoy</a>
      <a href="semana.html">Esta semana</a>
    </nav>
    <p class="updated" id="updated">Cargando…</p>
  </div>

  <main>
    <div class="filters">
      <label class="filter">
        <span>Fuentes</span>
        <select id="fuente-filtro" aria-label="Filtrar por fuente">
          <option value="Todas">Todas</option>
        </select>
      </label>
      <label class="filter">
        <span>Fecha</span>
        <select id="fecha-filtro" aria-label="Filtrar por fecha">
          <option value="todas">Todas las fechas</option>
          <option value="hoy">Hoy</option>
          <option value="ayer">Ayer</option>
          <option value="7d">Últimos 7 días</option>
          <option value="30d">Últimos 30 días</option>
        </select>
      </label>
    </div>
    <p class="status" id="status" hidden></p>
    <section class="grid" id="grid"></section>
    <div class="pager" id="pager" hidden>
      <button type="button" id="mas">Cargar más</button>
    </div>
  </main>

  <footer>
    <div class="footer-inner">
      <a class="footer-key" href="podcast.html" aria-label="Iniciar sesión">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M8 6.6a5.4 5.4 0 1 0 4.15 8.85H15.2v2.15h2.25V15.45H19v1.7h2.2V12H12.15A5.4 5.4 0 0 0 8 6.6Zm0 3.35a2.05 2.05 0 1 1 0 4.1 2.05 2.05 0 0 1 0-4.1Z"/>
        </svg>
      </a>
      <p class="footer-legal">Agregador sin fines comerciales. Las notas pertenecen a sus medios originales. Contacto para bajas: <a href="mailto:pistonlibre@gmail.com">pistonlibre@gmail.com</a></p>
      <p class="credit">Desarrollado por <a href="https://thesib.dev" target="_blank" rel="noopener noreferrer">thesib.dev</a></p>
    </div>
  </footer>

  <a class="back-to-top" href="#top" aria-label="Volver arriba">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M6 14.5 12 8.5 18 14.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </a>
  <script src="site.js"></script>
  <script src="app.js"></script>
</body>
</html>
