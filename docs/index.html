<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Punto muerto</title>
  <meta name="description" content="Resumen diario de noticias de autos.">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="brand">
      <img class="logo" src="logo.png" alt="Cambio manual en punto muerto" width="72" height="72">
      <div>
        <p class="eyebrow">Resumen diario de noticias</p>
        <h1>Punto muerto</h1>
      </div>
    </div>
    <p class="updated" id="updated">Cargando…</p>
  </header>

  <main>
    <div class="filters">
      <label class="filter">
        <span>Fuentes</span>
        <select id="fuente-filtro" aria-label="Filtrar por fuente">
          <option value="Todas">Todas</option>
        </select>
      </label>
      <label class="filter">
        <span>Fecha</span>
        <select id="fecha-filtro" aria-label="Filtrar por fecha">
          <option value="todas">Todas las fechas</option>
          <option value="hoy">Hoy</option>
          <option value="ayer">Ayer</option>
          <option value="7d">Últimos 7 días</option>
          <option value="30d">Últimos 30 días</option>
        </select>
      </label>
    </div>
    <p class="status" id="status" hidden></p>
    <section class="grid" id="grid"></section>
    <div class="pager" id="pager" hidden>
      <button type="button" id="mas">Cargar más</button>
    </div>
  </main>

  <footer>
    <div class="footer-inner">
      <p>Sitio estático generado desde RSS. Cada nota abre en su medio original.</p>
      <p class="credit">Desarrollado por <a href="https://thesib.dev" target="_blank" rel="noopener noreferrer">thesib.dev</a></p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
