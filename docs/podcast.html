<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Podcast — Pistón libre</title>
  <meta name="description" content="Sección para administradores de Pistón libre.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="favicon.png">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("pm-theme");
        if (t !== "light" && t !== "dark") t = "dark";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body id="top">
  <header class="site-header">
    <div class="site-header-inner">
      <a class="site-header-logo" href="index.html">
        <img class="logo" src="logo.png" alt="Pistón libre" width="48" height="48">
      </a>
      <a class="site-header-title" href="index.html">
        <img class="lettering" src="lettering.png" alt="Pistón Libre" width="138" height="40">
      </a>
      <div class="site-header-tools">
        <button type="button" class="header-logout" id="cerrar-sesion" hidden>Cerrar sesión</button>
        <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Cambiar tema">
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M15.1 3.2a8.7 8.7 0 1 0 5.7 15.3 9.1 9.1 0 0 1-5.7-15.3Z"/>
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 3.2v1.8M12 19v1.8M3.2 12h1.8M19 12h1.8M5.6 5.6l1.3 1.3M17.1 17.1l1.3 1.3M18.4 5.6l-1.3 1.3M6.9 17.1l-1.3 1.3"/>
          </svg>
        </button>
      </div>
    </div>
  </header>
  <main>
    <div class="admin-login" id="admin-login">
      <p class="eyebrow">Sección para administradores</p>
      <form class="gate" id="gate">
        <label class="filter" for="clave">
          <span>Contraseña</span>
          <input id="clave" name="clave" type="password" autocomplete="current-password" required>
        </label>
        <div class="gate-actions">
          <button type="submit">Entrar</button>
          <a class="gate-back" href="index.html">Volver</a>
        </div>
        <p class="status" id="gate-error" hidden></p>
      </form>
    </div>

    <section id="studio" hidden>
      <div class="filters filters-split">
        <label class="filter">
          <span>Fecha</span>
          <select id="semana-filtro" aria-label="Elegir borrador por fecha"></select>
        </label>
        <div class="filters-end">
          <span class="pill pill-current">Guiones</span>
          <button type="button" class="pill" id="accion-vista" hidden>Ver guion</button>
          <button type="button" class="pill" id="accion-nuevo">Crear nuevo guion</button>
          <button type="button" class="pill pill-current" id="accion-guardar" hidden>Guardar</button>
        </div>
      </div>
      <form class="crear-panel" id="crear-panel" hidden>
        <div id="crear-paso-clave">
          <label class="filter" for="crear-clave">
            <span>Contraseña</span>
            <input id="crear-clave" name="crear-clave" type="password" autocomplete="current-password" required>
          </label>
          <div class="crear-acciones">
            <button type="submit">Continuar</button>
            <button type="button" class="pill" id="crear-volver">Cancelar</button>
          </div>
        </div>
        <div id="crear-paso-extra" hidden>
          <label class="crear-extra" for="crear-extra">
            <span>Indicaciones para este borrador</span>
            <textarea id="crear-extra" name="crear-extra" rows="5" maxlength="4000" placeholder="Opcional: tono, temas a enfatizar, lo que no quieras que salga…"></textarea>
          </label>
          <div class="crear-acciones">
            <button type="button" class="pill" id="crear-enviar">Crear con GPT</button>
            <button type="button" class="pill" id="crear-cerrar">Cancelar</button>
          </div>
        </div>
        <p class="status" id="crear-error" hidden></p>
      </form>
      <p class="status" id="status" hidden></p>
      <article class="guion-card" id="guion"></article>
    </section>
  </main>

  <footer>
    <div class="footer-inner">
      <a class="footer-key" href="podcast.html" aria-label="Iniciar sesión" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M8 6.6a5.4 5.4 0 1 0 4.15 8.85H15.2v2.15h2.25V15.45H19v1.7h2.2V12H12.15A5.4 5.4 0 0 0 8 6.6Zm0 3.35a2.05 2.05 0 1 1 0 4.1 2.05 2.05 0 0 1 0-4.1Z"/>
        </svg>
      </a>
      <p class="footer-legal">Agregador sin fines comerciales. Las notas pertenecen a sus medios originales. Contacto para bajas: <a href="mailto:pistonlibre@gmail.com">pistonlibre@gmail.com</a></p>
      <p class="credit">Desarrollado por <a href="https://thesib.dev" target="_blank" rel="noopener noreferrer">thesib.dev</a></p>
    </div>
  </footer>

  <a class="back-to-top" href="#top" aria-label="Volver arriba">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M6 14.5 12 8.5 18 14.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </a>
  <script src="site.js"></script>
  <script src="podcast.js"></script>
</body>
</html>
