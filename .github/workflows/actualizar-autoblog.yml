name: Actualizar Autoblog

# Autoblog.com.ar está detrás de Cloudflare y bloquea las IPs de
# ubuntu-latest (Azure). Este job corre en macOS (otro rango) y solo
# después del job principal, para no pisar noticias.json.
on:
  workflow_run:
    workflows: ["Actualizar noticias"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: noticias-docs
  cancel-in-progress: false

jobs:
  autoblog:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/cache@v4
        with:
          path: noticias.db
          key: noticias-db
          restore-keys: |
            noticias-db

      - name: Bajar solo Autoblog
        env:
          PUNTO_PODCAST_PASSWORD: ${{ secrets.PUNTO_PODCAST_PASSWORD }}
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
        run: dotnet run -- --fuente "Autoblog Argentina"

      - name: Publicar si hubo cambios
        run: |
          git config user.name "punto-muerto-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/noticias.json docs/semana.json docs/guiones.json docs/guiones
          if git diff --cached --quiet; then
            echo "Sin notas nuevas de Autoblog"
            exit 0
          fi
          git commit -m "chore: actualizar Autoblog $(date -u +%Y-%m-%d)"
          git push
