name: Actualizar noticias

on:
  schedule:
    # 10:00, 13:00 y 16:00 Argentina. El :20 es reintento si GitHub salteó el :00.
    - cron: "0 13,16,19 * * *"
    - cron: "20 13,16,19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: noticias-docs
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/cache@v4
        with:
          path: noticias.db
          key: noticias-db
          restore-keys: |
            noticias-db

      - name: Bajar feeds y armar docs
        env:
          PUNTO_PODCAST_PASSWORD: ${{ secrets.PUNTO_PODCAST_PASSWORD }}
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
        run: dotnet run -- --sin-fuente Autoblog

      - name: Publicar si hubo cambios
        run: |
          git config user.name "punto-muerto-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/noticias.json docs/semana.json docs/guiones.json docs/guiones
          if git diff --cached --quiet; then
            echo "Sin cambios en docs/"
            exit 0
          fi
          git commit -m "chore: actualizar noticias $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
